# Каждые 15 минут проверяет почту подключённых ящиков: ответы посредников попадают в сделки.
# Использует те же секреты, что и проверка ссылок: APP_URL и CRON_SECRET.
name: Mail sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync mailboxes
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Додайте секрети APP_URL і CRON_SECRET"
            exit 1
          fi
          code=$(curl -sS -o body.txt -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/mail-sync" || echo "000")
          echo "HTTP $code: $(head -c 500 body.txt)"
          [ "$code" = "200" ] || exit 1
